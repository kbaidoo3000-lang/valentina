<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine 💖</title>
  <style>
    body {
      background: #ffe6f0;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      padding-top: 100px;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    #yes {
      background: #ff4d88;
      color: white;
    }
    #no {
      background: #ccc;
      position: absolute;
    }
  </style>
</head>

<body>
  <h1>Will you be my Valentine? 💕</h1>

  <button id="yes" onclick="yesClicked()">YES 💖</button>
  <button id="no" onclick="moveNo()">NO 🙃</button>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      noBtn.style.top = Math.random() * 80 + "vh";
      noBtn.style.left = Math.random() * 80 + "vw";
      noBtn.innerText = "Try again 😌";
    }

    function yesClicked() {
      document.body.innerHTML =
        "<h1>YAY 💕😭<br>Best Valentine Ever!</h1>";
    }
  </script>
</body>
</html>
